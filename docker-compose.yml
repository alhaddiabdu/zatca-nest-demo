name: zatca-demo

services:
  # خادم NestJS (الربط مع الهيئة)
  # MASTER_KEY يُقرأ من .env، والتشغيل يتوقف إن لم يوجد
  api:
    build: .
    env_file: .env
    environment:
      PORT: 3000
      # داخل الشبكة: المضيف postgres والمنفذ 5432 (يتجاوز قيمة DATABASE_URL المحلية في .env)
      DATABASE_URL: postgres://${POSTGRES_USER:-zatca}:${POSTGRES_PASSWORD:-zatca_dev_only}@postgres:5432/${POSTGRES_DB:-zatca}
      # fake = لا اتصال بالهيئة (الافتراضي)، live = الاتصال الحقيقي
      ZATCA_TRANSPORT: ${ZATCA_TRANSPORT:-fake}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3010:3000"
    restart: unless-stopped

  # واجهة React تُقدَّم عبر nginx، وتحوّل طلبات /zatca إلى api
  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "8090:80"
    restart: unless-stopped

  # قاعدة البيانات: المفاتيح (مشفرة) والشهادات والسلسلة والفواتير
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zatca}
      POSTGRES_USER: ${POSTGRES_USER:-zatca}
      # القيمة الافتراضية للتطوير المحلي فقط، غيّرها في .env
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zatca_dev_only}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # متاح من هذا الجهاز فقط، للتطوير والاختبارات
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  pgdata:
