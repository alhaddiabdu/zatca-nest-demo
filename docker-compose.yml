name: zatca-demo

services:
  # خادم NestJS (الربط مع الهيئة)
  api:
    build: .
    env_file: .env
    environment:
      PORT: 3000
      DATA_DIR: /app/data
    volumes:
      # المفاتيح والشهادات والفواتير تبقى محفوظة حتى بعد إعادة تشغيل الحاوية
      - zatca-data:/app/data
    ports:
      - "3010:3000"
    restart: unless-stopped

  # واجهة React تُقدَّم عبر nginx، وتحوّل طلبات /zatca إلى api
  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "8090:80"
    restart: unless-stopped

  # قاعدة البيانات (لا يعتمد عليها api بعد)
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zatca}
      POSTGRES_USER: ${POSTGRES_USER:-zatca}
      # القيمة الافتراضية للتطوير المحلي فقط، غيّرها في .env
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zatca_dev_only}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # متاح من هذا الجهاز فقط، للتطوير والاختبارات
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  zatca-data:
  pgdata:
